server.port=${PORT:8080}
spring.threads.virtual.enabled=true
spring.web.resources.add-mappings=false
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/css,text/plain,text/javascript,application/javascript,application/json,image/svg+xml,application/vnd.apple.mpegurl
gateway.engine-url=${ENGINE_URL:https://cdn1.lvn123.site}
gateway.web-root=${WEB_ROOT:file:../web/dist/}
gateway.connect-timeout=5s
gateway.request-timeout=60s
