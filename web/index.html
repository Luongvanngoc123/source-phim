<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Animora — xem anime vietsub, lịch chiếu và tập mới nhất."
    />
    <meta
      name="theme-color"
      content="#F3F3FA"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#121125"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Animora</title>
    <script>
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem("animora:lights");
        } catch {
          stored = null;
        }
        let lights = stored;
        if (lights !== "on" && lights !== "off") {
          lights = matchMedia("(prefers-color-scheme: dark)").matches
            ? "off"
            : "on";
        }
        document.documentElement.dataset.lights = lights;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
